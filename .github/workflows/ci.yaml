# CI workflow to build, test, and lint the CRUD app on push or pull request
name: CI Pipeline

on:
  push:
    branches: [main]  # Trigger on pushes to main branch
  pull_request:
    branches: [main]  # Trigger on PRs to main branch

concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest  # Use GitHub's free Linux runner
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4 # Check out the repository code
      - uses: actions/setup-node@v4 # Install Node.js environment
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./${{matrix.app}}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
